version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ride-sharing-mysql
    restart: unless-stoppeds
    environment:
      MYSQL_ROOT_PASSWORD: 6574839201Phanh
      MYSQL_DATABASE: ride_sharing
      MYSQL_USER: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ride_sharing_user", "-pride_sharing_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ride-sharing-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_USER=ride_sharing_user
      - DB_PASSWORD=ride_sharing_password
      - DB_NAME=ride_sharing
      - DB_PORT=3306
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
    command: >
      sh -c "npm install; npm run dev"

  # Frontend React app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ride-sharing-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_SOCKET_URL=http://localhost:5000
      - NODE_ENV=development
    command: >
      sh -c "npm install; npm start"

volumes:
  mysql-data:
    driver: local